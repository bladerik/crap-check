name: release
# Stages the package on npm when a GitHub release is published (tag v<version>, matching package.json).
# npm trusted publishing: no token; the package's npm settings trust this workflow for `npm stage publish`
# only. The version goes live when a maintainer approves it with 2FA (npmjs.com → Staged Packages, or
# `npm stage approve <stage-id>`).
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: dist is built from src
        run: pnpm build && git diff --exit-code -- dist
      - name: tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm stage publish --access public --provenance
